<div class="card h-100">
  <div class="trip-visual" aria-hidden="true">
    <span>{{ trip.code }}</span>
  </div>

  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ trip.name }}</h5>

    <p class="card-text">
      <strong>Length:</strong> {{ trip.length }}<br>
      <strong>Start:</strong> {{ trip.start | date }}<br>
      <strong>Resort:</strong> {{ trip.resort }}<br>
      <strong>Price:</strong> {{ trip.perPerson }}
    </p>

    <p class="card-text flex-grow-1">{{ trip.description }}</p>

    <div>
      <a class="btn btn-outline-primary me-2" [routerLink]="['/edit', trip.code]">Edit</a>
      <button class="btn btn-outline-danger" type="button" (click)="onDelete()">Delete</button>
    </div>
  </div>
</div>
