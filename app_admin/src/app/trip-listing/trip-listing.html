<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>Trip Listing</h1>

  <a class="btn btn-success" routerLink="/add">
    Add New Trip
  </a>
</div>

<div *ngIf="message" class="alert alert-danger">
  {{ message }}
</div>

<div class="row">
  <div class="col-md-4 mb-4" *ngFor="let trip of trips">
    <app-trip-card
      [trip]="trip"
      (deleteTrip)="deleteTrip($event)">
    </app-trip-card>
  </div>
</div>
