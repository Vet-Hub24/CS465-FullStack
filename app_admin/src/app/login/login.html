<h1>Admin Login</h1>

<div *ngIf="message" class="alert alert-danger">
  {{ message }}
</div>

<div class="card">
  <div class="card-body">
    <form #loginForm="ngForm" (ngSubmit)="onLoginSubmit()" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input
          class="form-control"
          name="email"
          type="email"
          [(ngModel)]="credentials.email"
          required
        >
      </div>

      <div class="col-md-6">
        <label class="form-label">Password</label>
        <input
          class="form-control"
          name="password"
          type="password"
          [(ngModel)]="credentials.password"
          required
        >
      </div>

      <div class="col-12">
        <button class="btn btn-primary me-2" type="submit" [disabled]="loginForm.invalid">
          Login
        </button>

        <button class="btn btn-secondary" type="button" (click)="onRegisterSubmit()">
          Register Test Admin
        </button>
      </div>
    </form>
  </div>
</div>
