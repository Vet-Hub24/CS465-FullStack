name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        run: npm install

      - name: Check server JavaScript syntax
        run: npm run check

      - name: Install Angular dependencies
        run: npm install --prefix app_admin

      - name: Build Angular admin SPA
        run: npm run build:admin
